kind = "web"
previewPath = "/__clone-gopack-web/"
title = "GoPack Web (Clone)"
version = "1.0.0"
id = "artifacts/gopack-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/__clone-gopack-web/" ]
localPort = 23381

[services.development]
run = "pnpm --filter @workspace/gopack-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gopack-web", "run", "build" ]
publicDir = "artifacts/gopack-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23381"
BASE_PATH = "/__clone-gopack-web/"
