kind = "video"
videoAspectRatio = "9:16"
previewPath = "/packyo-mobile-tour/"
title = "Packyo Mobile Tour"
description = "A portrait product-tour video showcasing the Packyo mobile app experience across authentication, trip planning, collaboration, discovery, packing, itinerary management, memories, and profile screens."
version = "1.0.0"
id = "artifacts/packyo-mobile-tour"
router = "path"

[[services]]
name = "web"
paths = [ "/packyo-mobile-tour/" ]
localPort = 21984

[services.development]
run = "pnpm --filter @workspace/packyo-mobile-tour run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/packyo-mobile-tour", "run", "build" ]
serve = "static"
publicDir = "artifacts/packyo-mobile-tour/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21984"
BASE_PATH = "/packyo-mobile-tour/"
