kind = "web"
previewPath = "/multimind-math/"
title = "MultiMind Math"
version = "1.0.0"
id = "artifacts/multimind-math"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/multimind-math/" ]
localPort = 20713

[services.development]
run = "pnpm --filter @workspace/multimind-math run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/multimind-math", "run", "build" ]
publicDir = "artifacts/multimind-math/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20713"
BASE_PATH = "/multimind-math/"
